# Автоматическая публикация приложения на GitHub Pages.
# Срабатывает при каждом push в ветку main (или вручную кнопкой Run workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, которые нужны GitHub Actions, чтобы опубликовать сайт.
permissions:
  contents: read
  pages: write
  id-token: write

# Если запушили два раза подряд — доводим до конца только последнюю сборку.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci — установка зависимостей строго по package-lock.json.
      - run: npm ci

      # Сборка статики в папку out/. Подпапка в адресе задаётся здесь.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /mobility-app

      # Без .nojekyll GitHub Pages выбрасывает папку _next (считает служебной),
      # и сайт открывается без стилей и скриптов.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
